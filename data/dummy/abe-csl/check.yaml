# data/dummy/abe-csl/check.yaml — 引用様式の受入テスト (scripts/check-csl.sh) のフィクスチャの設定
# (キーの意味は main/step02_build/check_csl.py の冒頭)
journal: abe
official_examples: 6          # expected.txt の 1〜6 行目が規定の公式例 (7〜10 行目は本テンプレートが足した検証用)
citation_form: brackets       # 本文の引用は角括弧で上付きにしない。docx で実測する
# 文献リストの番号の形。学会テンプレートの文献の見本は「[1] TAB 本文」。番号と区切りの TAB は
# profile の bibliography.label_separator: tab で決まる (docx では番号の後の空白を後処理が消す)
bibliography_label: "[{n}]"
# 本文の引用の期待値 (main.md の出現順。図の題の引用は 1 回だけ数える)。規定の形は [1] / [3, 4] / [7–10]
# (3 件以上の連番はエンダッシュでまとめ、2 件の連番はカンマ + 空白)。main.md の引用を変えたらここも直す
citations:
  - "[1]"            # 公式例の初出 (hohne → born → chandler → heel → white → abe)
  - "[2]"
  - "[3]"
  - "[4]"
  - "[5]"
  - "[6]"
  - "[7]"            # 公式例に無い形の初出 (yokan → dan → chokkan → hunch)
  - "[8]"
  - "[9]"
  - "[10]"
  - "[3, 4]"         # 2 件の連番はまとめない (規定の [3, 4])
  - "[7–10]"         # 4 件の連番はエンダッシュでまとめる (規定の [7–10] そのもの)
  - "[1, 5]"         # 離れた 2 件を逆順に書いても番号順に並ぶ
  - "[2, p. 70]"     # ページの指定 (規定に例は無い。本テンプレートの形)
  - "[1]"            # 表のセルの中
  - "[5]"
  - "[2]"            # 図の題の中
